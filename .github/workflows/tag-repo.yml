#
# tag-repo
#
# This workflow is used to apply tags to branches pushed to or merged into the repository.
# - main will be tagged with the latest version number.
# - feature/LREG-* and hotfix/LREG-* branches will be tagged with a prerelease version number
#   including the story from the branch name.
#
name: tag-repo
on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
  push:
    branches:
      - feature/LREG-*
      - hotfix/LREG-*

permissions:
  contents: write

jobs:
  tag-repo:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.LIS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LIS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out pushed branch
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Check out destination branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Calculate and push tag
        id: calc-and-stamp
        uses: cake-build/cake-action@v3
        with:
          script-path: ./.github/workflows/tag-repo.cake
