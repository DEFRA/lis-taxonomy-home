#
# node-build-test-analyze
#
# This workflow is used to perform various checks and validations on code changes.
# This will
# - run the optional "build:frontend" task
# - run the required "format:check" task
# - run the required "lint" task
# - run the required "test" task
# - validate the Dockfile (if available) is correct and builds a container image
# - call sonarcloud to validate the code quality
#
name: node-build-test-analyze
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - feature/LREG-*
      - hotfix/LREG-*

jobs:
  node-build-test-analyze:
    name: Build, Test, and Analyze node project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Perform build, test, and analyze
        uses: cake-build/cake-action@v3
        with:
          script-path: ./.github/workflows/node-build-test-analyze.cake

      - name: SonarQube Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
